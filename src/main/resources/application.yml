spring:
  application:
    name: library-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/library}
    username: ${DB_USER:library_user}
    password: ${DB_PASSWORD:library_pass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    data:
      web:
        pageable:
          default-page-size: 20
          max-page-size: 100
    properties:
      hibernate:
        format_sql: true
library:
  loan-days: 7
  max-active-loans: 3
  fine-per-day: 5.00
  timezone: America/Mexico_City