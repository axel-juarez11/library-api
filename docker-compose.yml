services:
  db:
    image: postgres:16
    container_name: library-db
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library_user
      POSTGRES_PASSWORD: library_pass
      TZ: America/Mexico_City
      PGTZ: America/Mexico_City
    ports:
      - "5433:5432"
    volumes:
      - library_data:/var/lib/postgresql/data

volumes:
  library_data: